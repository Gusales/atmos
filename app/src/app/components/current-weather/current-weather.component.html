<section
    class="h-full relative grid grid-rows-[max-content_1fr_max-content] gap-6 min-[1200px]:gap-10 p-3.5 rounded-[10px] backdrop-blur-[10px] bg-primary bg-[url('/assets/images/bg-temp-now.jpeg')] bg-cover"
  >
    <app-weather-icon
      [name]="currentWeather"
      class="absolute top-0 left-0 h-32 w-32 min-[1200px]:-top-10 min-[1200px]:-left-10 min-[1200px]:h-44 min-[1200px]:w-44"
    />

    <div class="flex items-center justify-end gap-2 m-5">
      <button
        type="button"
        class="h-8 w-8 grid place-content-center transition-transform duration-180 ease-out active:scale-90 focus-visible:outline focus-visible:outline-white/40 focus-visible:outline-offset-2 rounded-full"
        [attr.aria-pressed]="isFavorite"
        [attr.aria-label]="isFavorite ? 'Remover dos favoritos' : 'Adicionar aos favoritos'"
        (click)="favoriteToggled.emit()"
      >
        <app-star-icon [filled]="isFavorite" [size]="18" />
      </button>
      <img src="/assets/svg/location-crosshairs.svg" alt="Icone que indica a localização" />
      <p class="font-bold text-muted text-[14px]">{{ location }}</p>
    </div>

    <div class="text-center font-bold flex justify-center gap-1">
      <div class="text-[56px] min-[1200px]:text-[88px] flex flex-col gap-1">
        {{ currentTemperature }}
        <div class="text-[16px] min-[1200px]:text-[20px]">
          {{ maximunTemperature }}°
          <span class="text-muted"> {{ minimumTemperature }}° </span>
        </div>
      </div>
      <div class="text-[16px] min-[1200px]:text-[24px] text-subtle mt-2 min-[1200px]:mt-3.75">°C</div>
    </div>

    <div class="grid grid-cols-3 gap-2">
      <div class="flex items-center py-2 px-2 min-[1200px]:py-3 min-[1200px]:px-4 gap-2 min-[1200px]:gap-3 bg-primary/60 rounded-md">
        <img src="/assets/svg/wind.svg" alt="Icone de vento" />
        <div>
          <h3 class="font-normal text-[12px] leading-3.5 text-secondary">Vento</h3>
          <h2 class="font-bold text-[14px] min-[1200px]:text-[18px] text-secondary">{{ windSpeed }} <span class="text-[14px] text-subtle">km/h</span></h2>
        </div>
      </div>
      <div class="flex items-center py-2 px-2 min-[1200px]:py-3 min-[1200px]:px-4 gap-2 min-[1200px]:gap-3 bg-primary/60 rounded-md">
        <img src="/assets/svg/humidity.svg" alt="Icone de umidade" />
        <div>
          <h3 class="font-normal text-[12px] leading-3.5 text-secondary">Umidade</h3>
          <h2 class="font-bold text-[14px] min-[1200px]:text-[18px] text-secondary">{{ humidity }} <span class="text-[14px] text-subtle">%</span></h2>
        </div>
      </div>
      <div class="flex items-center py-2 px-2 min-[1200px]:py-3 min-[1200px]:px-4 gap-2 min-[1200px]:gap-3 bg-primary/60 rounded-md">
        <img src="/assets/svg/rain.svg" alt="Icone de chuva" />
        <div>
          <h3 class="font-normal text-[12px] leading-3.5 text-secondary">Chuva</h3>
          <h2 class="font-bold text-[14px] min-[1200px]:text-[18px] text-secondary">{{ rainProbabilityPercent }} <span class="text-[14px] text-subtle">%</span></h2>
        </div>
      </div>
    </div>
  </section>
