<section class="flex justify-center gap-6 p-10 rounded-[10px] backdrop-blur-[10px] bg-primary">
    @for (day of weatherDays; track day.name) {
      <div class="flex flex-col items-center justify-center gap-4">
        <h2 class="text-[14px]">{{ day.name }}</h2>
        <app-weather-icon [name]="day.weather" class="h-16 w-16" />
        <div class="text-[14px]">24° <span class="text-muted"> 18° </span></div>
      </div>
    }
  </section>
