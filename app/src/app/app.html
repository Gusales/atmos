<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">

<main
  id="app"
  class="min-h-screen text-white font-['Lato',sans-serif] bg-[url('/assets/images/bg.jpg')] bg-cover bg-center bg-no-repeat grid place-content-center gap-6 p-16 min-[1200px]:grid-cols-[480px_277px_277px] min-[1200px]:grid-rows-[244px_212px]"
>
  <section
    class="min-[1200px]:row-[1/3] relative grid grid-rows-[max-content_1fr_max-content] gap-10 p-3.5 rounded-[10px] backdrop-blur-[10px] bg-primary bg-[url('/assets/images/bg-temp-now.jpeg')] bg-cover"
  >
    <div
      class="absolute -top-14 -left-14 h-44 w-44 bg-[url('/assets/svg/clouds.svg')] bg-no-repeat"
    ></div>

    <div class="flex justify-end gap-1 m-5">
      <img src="/assets/svg/location-crosshairs.svg" alt="Icone que indica a localização" />
      <p class="font-bold text-muted text-[14px]">São Paulo, SP</p>
    </div>

    <div class="text-center font-bold flex justify-center gap-1">
      <div class="text-[88px] flex flex-col gap-1">
        18
        <div class="text-[20px]">
          22°
          <span class="text-muted"> 16° </span>
        </div>
      </div>
      <div class="text-[24px] text-subtle mt-3.75">°C</div>
    </div>

    <div class="grid grid-flow-col gap-2">
      <div class="flex items-center py-3 px-4 gap-3 bg-primary/60 rounded-md">
        <img src="/assets/svg/wind.svg" alt="Icone de vento" />
        <div>
          <h3 class="font-normal text-[12px] leading-3.5 text-secondary">Vento</h3>
          <h2 class="font-bold text-[18px] text-secondary">17 <span class="text-[14px] text-subtle">km/h</span></h2>
        </div>
      </div>
      <div class="flex items-center py-3 px-4 gap-3 bg-primary/60 rounded-md">
        <img src="/assets/svg/humidity.svg" alt="Icone de umidade" />
        <div>
          <h3 class="font-normal text-[12px] leading-3.5 text-secondary">Umidade</h3>
          <h2 class="font-bold text-[18px] text-secondary">31 <span class="text-[14px] text-subtle">%</span></h2>
        </div>
      </div>
      <div class="flex items-center py-3 px-4 gap-3 bg-primary/60 rounded-md">
        <img src="/assets/svg/rain.svg" alt="Icone de chuva" />
        <div>
          <h3 class="font-normal text-[12px] leading-3.5 text-secondary">Chuva</h3>
          <h2 class="font-bold text-[18px] text-secondary">10 <span class="text-[14px] text-subtle">%</span></h2>
        </div>
      </div>
    </div>
  </section>

  <section class="grid text-center max-h-69.25 gap-8 p-4 rounded-[10px] backdrop-blur-[10px] bg-primary">
    <div class="flex items-center justify-center gap-2">
      <img src="/assets/svg/leaf.svg" alt="Icone de uma folha" />
      <h2 class="text-[16px] text-subtle">Qualidade do ar</h2>
    </div>
    <div>
      <h3 class="font-bold text-[18px] text-accent">Boa</h3>
      <h2 class="mt-1 text-[40px] text-secondary">21</h2>
    </div>
    <div class="grid grid-flow-col gap-4">
      <div class="grid gap-0.5">
        <p class="font-bold text-[14px] text-accent">12.9</p>
        <p class="text-[12px] uppercase text-secondary">PM2.5</p>
      </div>
      <div class="grid gap-0.5">
        <p class="font-bold text-[14px] text-accent">12.9</p>
        <p class="text-[12px] uppercase text-secondary">PM10</p>
      </div>
      <div class="grid gap-0.5">
        <p class="font-bold text-[14px] text-accent">2.1</p>
        <p class="text-[12px] uppercase text-secondary">sO₂</p>
      </div>
      <div class="grid gap-0.5">
        <p class="font-bold text-[14px] text-accent">1.4</p>
        <p class="text-[12px] uppercase text-secondary">NO₂</p>
      </div>
      <div class="grid gap-0.5">
        <p class="font-bold text-[14px] text-accent">21.2</p>
        <p class="text-[12px] uppercase text-secondary">O₃</p>
      </div>
      <div class="grid gap-0.5">
        <p class="font-bold text-[14px] text-accent">0.7</p>
        <p class="text-[12px] uppercase text-secondary">CO</p>
      </div>
    </div>
  </section>

  <section class="rounded-[10px] backdrop-blur-[10px] bg-primary">
    <div class="flex items-center justify-center gap-2 mt-4">
      <img src="/assets/svg/time.svg" alt="Icone do Sol" />
      <h2 class="text-[16px] text-subtle">Horário do sol</h2>
    </div>
    <div class="mt-10 h-27.5">
      <div
        class="relative mx-auto w-54 h-54 before:content-[''] before:block before:absolute before:top-1/2 before:left-1/2 before:-m-1.5 before:transform-[rotate(calc((((100-80)/-100)*180)*1deg))_translate(106px)] before:h-3 before:w-3 before:bg-[#f6c833] before:rounded-full"
      >
        <div
          class="w-54 h-27 overflow-hidden relative before:content-[''] before:block before:w-53.5 before:h-53.5 before:[background:linear-gradient(180deg,rgba(251,219,96,0.2)_0%,rgba(251,219,96,0)_101.89%)] before:rotate-144 before:rounded-full before:[mask:linear-gradient(0deg,#fff_50%,transparent_0%)]"
        >
          <img class="absolute top-0" src="/assets/svg/chart.svg" alt="Gráfico indicando o tempo" />
        </div>
        <time class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 font-bold text-[14px]">17:25</time>
      </div>
    </div>
    <div class="flex items-center justify-between max-w-69 mx-auto mt-2.5 mb-4 px-4">
      <time class="text-[14px]">06:00</time>
      <time class="text-[14px]">18:00</time>
    </div>
  </section>

  <section class="min-[1200px]:col-[2/4] flex justify-center gap-6 p-10 rounded-[10px] backdrop-blur-[10px] bg-primary">
    <div class="flex flex-col items-center justify-center gap-4">
      <h2 class="text-[14px]">Amanhã</h2>
      <img class="h-16 w-16" src="/assets/svg/clouds.svg" alt="Icone do clima de Hoje" />
      <div class="text-[14px]">21 ° <span class="text-muted"> 16° </span></div>
    </div>
    <div class="flex flex-col items-center justify-center gap-4">
      <h2 class="text-[14px]">Terça</h2>
      <img class="h-16 w-16" src="/assets/svg/sun.svg" alt="Icone do clima de Hoje" />
      <div class="text-[14px]">28° <span class="text-muted"> 20° </span></div>
    </div>
    <div class="flex flex-col items-center justify-center gap-4">
      <h2 class="text-[14px]">Quarta</h2>
      <img class="h-16 w-16" src="/assets/svg/clouds-rain.svg" alt="Icone do clima de Hoje" />
      <div class="text-[14px]">25° <span class="text-muted"> 21° </span></div>
    </div>
    <div class="flex flex-col items-center justify-center gap-4">
      <h2 class="text-[14px]">Quinta</h2>
      <img class="h-16 w-16" src="/assets/svg/clouds-thunder.svg" alt="Icone do clima de Hoje" />
      <div class="text-[14px]">20° <span class="text-muted"> 14° </span></div>
    </div>
    <div class="flex flex-col items-center justify-center gap-4">
      <h2 class="text-[14px]">Sexta</h2>
      <img class="h-16 w-16" src="/assets/svg/clouds-sun.svg" alt="Icone do clima de Hoje" />
      <div class="text-[14px]">24° <span class="text-muted"> 18° </span></div>
    </div>
  </section>
</main>

<router-outlet />
